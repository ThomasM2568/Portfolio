<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Project - Thomas Mirbey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-color: #0e1625;
      --text-color: #eef2f7;
      --section-bg: #111a2c;
      --card-bg: #112045;
      --accent-color: #1976d2;
      --accent-hover: #1565c0;
      --shadow-color: rgba(25, 118, 210, 0.5);
    }

    body.theme-aurora {
      --bg-color: #fdfbf7;
      --text-color: #4a3f35;
      --section-bg: #f5f0e6;
      --card-bg: #ffffff;
      --accent-color: #c5a059;
      --accent-hover: #a68546;
      --shadow-color: rgba(197, 160, 89, 0.3);
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .section-title {
      border-bottom: 2px solid var(--accent-color);
      display: inline-block;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .bg-section {
      background: var(--section-bg);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      transition: background 0.3s;
      border: 1px solid rgba(25, 118, 210, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .project-header {
      padding: 4rem 0;
      background: linear-gradient(135deg, var(--section-bg) 0%, var(--bg-color) 100%);
      border-radius: 0 0 50px 50px;
      margin-bottom: 3rem;
      border-bottom: 1px solid rgba(25, 118, 210, 0.1);
    }
    .back-btn {
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      transform: translateX(-5px);
    }
    .skill-badge {
      background: rgba(25, 118, 210, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 5px;
      display: inline-block;
    }
    .theme-aurora .skill-badge {
      background: rgba(197, 160, 89, 0.1);
    }
    .theme-aurora .bg-section {
      border-color: rgba(197, 160, 89, 0.1);
    }
    .theme-aurora .project-header {
      border-bottom-color: rgba(197, 160, 89, 0.1);
    }
    .project-icon-large {
      font-size: 4rem;
      color: var(--accent-color);
      margin-bottom: 1.5rem;
    }
    .controls-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }
    .control-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      min-width: 60px;
    }
  </style>
</head>
<body class="theme-nebula">
  <div class="controls-container">
    <button id="theme-toggle" class="control-btn">Aurore</button>
    <button id="lang-toggle" class="control-btn">EN</button>
  </div>

  <header class="project-header text-center">
    <div class="container">
      <div id="p-icon-container" class="project-icon-large">
        <i class="bi bi-rocket-takeoff"></i>
      </div>
      <h1 id="p-title" class="display-4 fw-bold mb-3">Project Title</h1>
      <h4 id="p-date" class="text-muted mb-4">Date</h4>
      <p id="p-desc" class="lead mx-auto" style="max-width: 800px;">Description</p>
    </div>
  </header>

  <div class="container pb-5">
    <div class="row">
      <div class="col-lg-8">
        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_overview">Project Overview</h2>
          <div id="p-details" class="lh-lg">
            <!-- Content from JSON -->
          </div>
        </section>
      </div>
      <div class="col-lg-4">
        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_tech">Skills</h2>
          <div id="p-skills">
            <!-- Skills from JSON -->
          </div>
        </section>
        
        <div class="text-center mt-4">
          <a href="index.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            <span id="back-btn-text">Back to Projects</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentLang = localStorage.getItem('preferredLang') || 'fr';
        let currentTheme = localStorage.getItem('preferredTheme') || 'nebula';
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let siteData = null;

        const applyTheme = (theme) => {
            document.body.className = `theme-${theme}`;
            document.getElementById('theme-toggle').textContent = theme === 'nebula' ? 
                (siteData ? siteData[currentLang].theme_aurora : 'Aurore') : 
                (siteData ? siteData[currentLang].theme_nebula : 'Nébuleuse');
        };

        const updateUI = (lang) => {
            if (!siteData) return;
            const data = siteData[lang];
            const project = data.projects.find(p => p.id === projectId || p.link.includes(projectId));
            
            if (project) {
                document.getElementById('p-title').textContent = project.title;
                document.getElementById('p-date').textContent = project.date;
                document.getElementById('p-desc').textContent = project.desc;
                document.getElementById('p-details').innerHTML = project.details || project.desc;
                document.title = project.title + " - Thomas Mirbey";
                
                // Update Icon
                const iconContainer = document.getElementById('p-icon-container');
                if (project.icon.startsWith('bi-')) {
                    iconContainer.innerHTML = `<i class="bi ${project.icon}"></i>`;
                } else {
                    iconContainer.innerHTML = `<img src="${project.icon}" style="width:80px; height:80px; object-fit:contain;">`;
                }

                // Update Skills
                const skillsContainer = document.getElementById('p-skills');
                if (project.skills) {
                    skillsContainer.innerHTML = project.skills.map(s => `<span class="skill-badge">${s}</span>`).join('');
                } else {
                    skillsContainer.innerHTML = '';
                }
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (data[key]) el.textContent = data[key];
            });
            
            // Fix back button text to avoid double arrows
            const backBtnText = data.back_btn.replace('← ', '').replace('←', '');
            document.getElementById('back-btn-text').textContent = backBtnText;

            document.getElementById('lang-toggle').textContent = lang === 'fr' ? 'EN' : 'FR';
            applyTheme(currentTheme);
        };

        fetch('data.json')
            .then(r => r.json())
            .then(data => {
                siteData = data;
                updateUI(currentLang);
            });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('preferredLang', currentLang);
            updateUI(currentLang);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'nebula' ? 'aurora' : 'nebula';
            localStorage.setItem('preferredTheme', currentTheme);
            applyTheme(currentTheme);
        });
        
        applyTheme(currentTheme);
    });
  </script>
</body>
</html>
