<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Project - Thomas Mirbey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    :root {
      --bg-color: #0e1625;
      --text-color: #eef2f7;
      --section-bg: #111a2c;
      --card-bg: #112045;
      --accent-color: #1976d2;
      --accent-hover: #1565c0;
      --shadow-color: rgba(25, 118, 210, 0.5);
    }

    body.theme-aurora {
      --bg-color: #fdfbf7;
      --text-color: #4a3f35;
      --section-bg: #f5f0e6;
      --card-bg: #ffffff;
      --accent-color: #c5a059;
      --accent-hover: #a68546;
      --shadow-color: rgba(197, 160, 89, 0.3);
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .section-title {
      border-bottom: 2px solid var(--accent-color);
      display: inline-block;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .bg-section {
      background: var(--section-bg);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      transition: background 0.3s;
      border: 1px solid rgba(25, 118, 210, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .theme-aurora .bg-section {
      border-color: rgba(197, 160, 89, 0.1);
    }
    .project-header {
      padding: 3rem 0;
      background: linear-gradient(135deg, var(--section-bg) 0%, var(--bg-color) 100%);
      border-radius: 0 0 50px 50px;
      margin-bottom: 3rem;
      border-bottom: 1px solid rgba(25, 118, 210, 0.1);
    }
    .back-btn {
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      transform: translateX(-5px);
    }
    .skill-badge {
      background: rgba(25, 118, 210, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 5px;
      display: inline-block;
    }
    .theme-aurora .skill-badge {
      background: rgba(197, 160, 89, 0.1);
    }
    .edu-date-badge {
      background: rgba(25, 118, 210, 0.08);
      color: var(--accent-color);
      border: 1px solid rgba(25, 118, 210, 0.2);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      display: inline-block;
    }
    .theme-aurora .edu-date-badge {
      background: rgba(197, 160, 89, 0.1);
      border-color: rgba(197, 160, 89, 0.2);
    }
    .project-icon-large {
      font-size: 4rem;
      color: var(--accent-color);
      margin-bottom: 1.5rem;
    }
    .controls-container {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    .theme-aurora .controls-container {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(197, 160, 89, 0.2);
      box-shadow: 0 8px 32px rgba(197, 160, 89, 0.15);
    }
    .control-btn {
      background: transparent;
      color: var(--text-color);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      font-size: 0.85rem;
      padding: 0;
    }
    .control-btn i {
      font-size: 1.2rem;
      z-index: 2;
      transition: transform 0.3s ease;
    }
    .control-btn span {
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .control-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--accent-color);
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.3s ease;
      border-radius: 50%;
      z-index: 1;
    }
    .control-btn:hover {
      color: white !important;
      transform: translateY(-3px);
    }
    .control-btn:hover i {
      transform: rotate(15deg);
    }
    .control-btn:hover::before {
      opacity: 1;
      transform: scale(1);
    }
    .theme-aurora .control-btn:hover {
      color: #fff !important;
    }

    /* Media Gallery Styles */
    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .media-item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(25, 118, 210, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .theme-aurora .media-item {
      border-color: rgba(197, 160, 89, 0.1);
    }
    .media-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px var(--shadow-color);
      border-color: var(--accent-color);
    }
    .media-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .media-caption {
      padding: 15px;
      font-size: 0.95rem;
      color: var(--text-color);
      font-weight: 500;
      text-align: center;
    }

    /* Lightbox Styles */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      animation: fadeIn 0.3s ease;
    }

    .lightbox-overlay.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      animation: slideIn 0.3s ease;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(90deg);
    }

    .lightbox-caption {
      color: white;
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    /* Code Block Styles */
    .code-block {
      background: #000000;
      border-radius: 12px;
      border: 1px solid #333333;
      margin: 20px 0;
      overflow: hidden;
    }

    .theme-aurora .code-block {
      background: #ffffff;
      border: 1px solid #e0e0e0;
    }

    .code-block-header {
      background: #1976d2;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: none;
    }

    .theme-aurora .code-block-header {
      background: #c5a059;
      border-bottom: none;
    }

    .code-block-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #ffffff;
    }

    .theme-aurora .code-block-label {
      color: #ffffff;
    }

    .code-block-copy {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-aurora .code-block-copy {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.2);
      color: #ffffff;
    }

    .code-block-copy:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .theme-aurora .code-block-copy:hover {
      background: rgba(0, 0, 0, 0.15);
      border-color: rgba(0, 0, 0, 0.3);
    }

    .code-block-content {
      padding: 16px;
      overflow-x: auto;
    }

    .code-block pre {
      margin: 0;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      background: #000000;
      color: #ffffff;
    }

    .theme-aurora .code-block pre {
      background: #ffffff;
      color: #000000;
    }

    .code-block code {
      color: #ffffff;
      background: none;
    }

    .theme-aurora .code-block code {
      color: #000000;
      background: none;
    }

    /* External Links Section */
    .links-section {
      margin-top: 20px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .links-grid-sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .link-card {
      background: var(--card-bg);
      border: 1px solid rgba(25, 118, 210, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      text-decoration: none;
      color: var(--text-color);
      flex-direction: column;
      text-align: center;
    }

    .theme-aurora .link-card {
      border-color: rgba(197, 160, 89, 0.15);
      background: #ffffff;
    }

    .link-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px var(--shadow-color);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .link-icon {
      font-size: 1.8rem;
      color: var(--accent-color);
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .link-content {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .link-url {
      font-size: 0.75rem;
      opacity: 0.6;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
    }

    /* Project Details List Styles */
    #p-details {
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    #p-details p {
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    #p-details ul {
      list-style: none;
      padding-left: 0;
      margin-top: 1.5rem;
    }

    #p-details li {
      margin-bottom: 0.75rem;
      padding-left: 1.5rem;
      position: relative;
      color: var(--text-color);
    }

    #p-details li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--accent-color);
      font-weight: bold;
      font-size: 1.2rem;
    }

    #p-details strong {
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .project-header {
        padding: 2rem 0;
        margin-bottom: 2rem;
      }
      .project-icon-large {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .bg-section {
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .controls-container {
        top: 10px;
        right: 10px;
        gap: 5px;
      }
      .control-btn {
        padding: 6px 12px;
        font-size: 0.85rem;
        min-width: 50px;
      }
      .media-gallery {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .skill-badge {
        font-size: 0.75rem;
        padding: 4px 12px;
        margin: 3px;
      }
      .links-grid {
        grid-template-columns: 1fr;
      }
      .lightbox-close {
        top: 10px;
        right: 10px;
      }
    }

    @media (max-width: 576px) {
      .project-header {
        padding: 1.5rem 0;
        margin-bottom: 1.5rem;
      }
      .project-icon-large {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      .container {
        padding: 0 10px;
      }
      .bg-section {
        padding: 1rem;
        border-radius: 12px;
      }
      .section-title {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      .controls-container {
        top: 5px;
        right: 5px;
        gap: 3px;
      }
      .control-btn {
        padding: 5px 10px;
        font-size: 0.75rem;
        min-width: 45px;
      }
      .back-btn {
        width: 100%;
        justify-content: center;
        padding: 0.75rem 1rem;
      }
      .code-block-content {
        padding: 12px;
      }
      .code-block pre {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body class="theme-nebula">
  <div class="controls-container">
    <button id="theme-toggle" class="control-btn">Aurore</button>
    <button id="lang-toggle" class="control-btn">EN</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox-overlay" class="lightbox-overlay">
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close">
        <i class="bi bi-x-lg"></i>
      </button>
      <img id="lightbox-image" class="lightbox-image" src="" alt="">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <header class="project-header text-center">
    <div class="container">
      <div id="p-icon-container" class="project-icon-large">
        <i class="bi bi-rocket-takeoff"></i>
      </div>
      <h1 id="p-title" class="display-4 fw-bold mb-3">Project Title</h1>
      <div class="mb-4">
        <span id="p-date" class="edu-date-badge">Date</span>
      </div>
      <p id="p-desc" class="lead mx-auto" style="max-width: 800px;">Description</p>
    </div>
  </header>

  <div class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_overview">Project Overview</h2>
          <div id="p-details" class="lh-lg">
            <!-- Content from JSON -->
          </div>
        </section>

        <section class="bg-section" id="media-section" style="display: none;">
          <h2 class="section-title" data-i18n="project_media">Visuals & Diagrams</h2>
          <div id="p-media" class="media-gallery">
            <!-- Media from JSON -->
          </div>
        </section>

        <section class="bg-section" id="code-section" style="display: none;">
          <h2 class="section-title" data-i18n="project_code">Code & Configuration</h2>
          <div id="p-code">
            <!-- Code blocks from JSON -->
          </div>
        </section>
        
        <div class="text-center mt-4">
          <a href="index.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            <span id="back-btn-text">Back to Projects</span>
          </a>
        </div>
      </div>

      <div class="col-lg-4">
        <section class="bg-section" id="links-section" style="display: none;">
          <h2 class="section-title" data-i18n="project_links">External Resources</h2>
          <div id="p-links" class="links-grid-sidebar">
            <!-- Links from JSON -->
          </div>
        </section>

        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_tech">Skills</h2>
          <div id="p-skills">
            <!-- Skills from JSON -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentLang = localStorage.getItem('preferredLang') || 'fr';
        let currentTheme = localStorage.getItem('preferredTheme') || 'nebula';
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let siteData = null;

        // Lightbox functionality
        const lightboxOverlay = document.getElementById('lightbox-overlay');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxClose = document.getElementById('lightbox-close');

        function openLightbox(imageSrc, caption) {
          lightboxImage.src = imageSrc;
          lightboxCaption.textContent = caption || '';
          lightboxOverlay.classList.add('active');
          document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
          lightboxOverlay.classList.remove('active');
          document.body.style.overflow = 'auto';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxOverlay.addEventListener('click', (e) => {
          if (e.target === lightboxOverlay) closeLightbox();
        });

        // Close lightbox on Escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeLightbox();
        });

        // Copy to clipboard functionality
        function setupCodeBlockCopy() {
          document.querySelectorAll('.code-block-copy').forEach(btn => {
            btn.addEventListener('click', function() {
              const codeContent = this.closest('.code-block').querySelector('code').textContent;
              navigator.clipboard.writeText(codeContent).then(() => {
                const originalText = this.textContent;
                this.textContent = 'Copied!';
                setTimeout(() => {
                  this.textContent = originalText;
                }, 2000);
              });
            });
          });
        }

        const applyTheme = (theme) => {
            document.body.className = `theme-${theme}`;
            if (siteData) {
                const data = siteData[currentLang];
                document.getElementById('theme-toggle').innerHTML = theme === 'nebula' ? 
                    '<i class="bi bi-sun-fill" title="' + data.theme_aurora + '"></i>' : 
                    '<i class="bi bi-moon-stars-fill" title="' + data.theme_nebula + '"></i>';
            }
        };

        const formatProjectDetails = (details) => {
            if (!details) return '';
            
            // Split by newline and process each line
            const lines = details.split('\n').filter(line => line.trim());
            let html = '';
            let inList = false;
            
            for (let line of lines) {
                const trimmed = line.trim();
                
                // Check if line starts with bullet point or dash
                if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    // Remove bullet and dash, clean up the text
                    const text = trimmed.replace(/^[•\-]\s*/, '');
                    html += `<li>${text}</li>`;
                } else if (trimmed) {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    // Add as paragraph
                    html += `<p>${trimmed}</p>`;
                }
            }
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        };

        const updateUI = (lang) => {
            if (!siteData) return;
            const data = siteData[lang];
            const project = data.projects.find(p => p.id === projectId || p.link.includes(projectId));
            
            if (project) {
                document.getElementById('p-title').textContent = project.title;
                document.getElementById('p-date').textContent = project.date;
                document.getElementById('p-desc').textContent = project.desc;
                
                // Format project details with proper list structure
                document.getElementById('p-details').innerHTML = formatProjectDetails(project.details || project.desc);
                
                document.title = project.title + " - Thomas Mirbey";
                
                // Update Icon
                const iconContainer = document.getElementById('p-icon-container');
                if (project.icon.startsWith('bi-')) {
                    iconContainer.innerHTML = `<i class="bi ${project.icon}"></i>`;
                } else {
                    iconContainer.innerHTML = `<img src="${project.icon}" style="width:80px; height:80px; object-fit:contain;">`;
                }

                // Update Skills
                const skillsContainer = document.getElementById('p-skills');
                if (project.skills) {
                    skillsContainer.innerHTML = project.skills.map(s => `<span class="skill-badge">${s}</span>`).join('');
                } else {
                    skillsContainer.innerHTML = '';
                }

                // Update Media Gallery
                const mediaSection = document.getElementById('media-section');
                const mediaContainer = document.getElementById('p-media');
                if (project.media && project.media.length > 0) {
                    mediaSection.style.display = 'block';
                    mediaContainer.innerHTML = project.media.map(media => `
                        <div class="media-item" onclick="openLightbox('${media.url}', '${media.caption || media.alt}')">
                            <img src="${media.url}" alt="${media.alt}" />
                            <div class="media-caption">${media.caption || media.alt}</div>
                        </div>
                    `).join('');
                } else {
                    mediaSection.style.display = 'none';
                }

                // Update Code Blocks
                const codeSection = document.getElementById('code-section');
                const codeContainer = document.getElementById('p-code');
                if (project.codeBlocks && project.codeBlocks.length > 0) {
                    codeSection.style.display = 'block';
                    codeContainer.innerHTML = project.codeBlocks.map(block => `
                        <div class="code-block">
                            <div class="code-block-header">
                                <span class="code-block-label">${block.label || 'Code'}</span>
                                <button class="code-block-copy">Copy</button>
                            </div>
                            <div class="code-block-content">
                                <pre><code class="language-${block.language || 'plaintext'}">${escapeHtml(block.code)}</code></pre>
                            </div>
                        </div>
                    `).join('');
                    setupCodeBlockCopy();
                } else {
                    codeSection.style.display = 'none';
                }

                // Update External Links
                const linksSection = document.getElementById('links-section');
                const linksContainer = document.getElementById('p-links');
                if (project.externalLinks && project.externalLinks.length > 0) {
                    linksSection.style.display = 'block';
                    linksContainer.innerHTML = project.externalLinks.map(link => {
                        const icon = link.icon || 'bi-link-45deg';
                        return `
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-card">
                                <div class="link-icon">
                                    <i class="bi ${icon}"></i>
                                </div>
                                <div class="link-content">
                                    <div class="link-title">${link.title}</div>
                                    <div class="link-url">${new URL(link.url).hostname}</div>
                                </div>
                            </a>
                        `;
                    }).join('');
                } else {
                    linksSection.style.display = 'none';
                }
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (data[key]) el.textContent = data[key];
            });
            
            // Fix back button text to avoid double arrows
            const backBtnText = data.back_btn.replace('← ', '').replace('←', '');
            document.getElementById('back-btn-text').textContent = backBtnText;

            document.getElementById('lang-toggle').innerHTML = `<span>${lang === 'fr' ? 'EN' : 'FR'}</span>`;
            applyTheme(currentTheme);
        };

        // Helper function to escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Make openLightbox globally accessible
        window.openLightbox = openLightbox;

        fetch('data.json')
            .then(r => r.json())
            .then(data => {
                siteData = data;
                updateUI(currentLang);
            });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('preferredLang', currentLang);
            updateUI(currentLang);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'nebula' ? 'aurora' : 'nebula';
            localStorage.setItem('preferredTheme', currentTheme);
            applyTheme(currentTheme);
        });
        
        applyTheme(currentTheme);
    });
  </script>
</body>
</html>
