<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Project - Thomas Mirbey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-color: #0e1625;
      --text-color: #eef2f7;
      --section-bg: #111a2c;
      --card-bg: #112045;
      --accent-color: #1976d2;
      --accent-hover: #1565c0;
      --shadow-color: rgba(25, 118, 210, 0.5);
    }

    body.theme-aurora {
      --bg-color: #fdfbf7;
      --text-color: #4a3f35;
      --section-bg: #f5f0e6;
      --card-bg: #ffffff;
      --accent-color: #c5a059;
      --accent-hover: #a68546;
      --shadow-color: rgba(197, 160, 89, 0.3);
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .section-title {
      border-bottom: 2px solid var(--accent-color);
      display: inline-block;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .bg-section {
      background: var(--section-bg);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      transition: background 0.3s;
      border: 1px solid rgba(25, 118, 210, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .theme-aurora .bg-section {
      border-color: rgba(197, 160, 89, 0.1);
    }
    .project-header {
      padding: 3rem 0;
      background: linear-gradient(135deg, var(--section-bg) 0%, var(--bg-color) 100%);
      border-radius: 0 0 50px 50px;
      margin-bottom: 3rem;
      border-bottom: 1px solid rgba(25, 118, 210, 0.1);
    }
    .back-btn {
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      transform: translateX(-5px);
    }
    .skill-badge {
      background: rgba(25, 118, 210, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 5px;
      display: inline-block;
    }
    .theme-aurora .skill-badge {
      background: rgba(197, 160, 89, 0.1);
    }
    .edu-date-badge {
      background: rgba(25, 118, 210, 0.08);
      color: var(--accent-color);
      border: 1px solid rgba(25, 118, 210, 0.2);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      display: inline-block;
    }
    .theme-aurora .edu-date-badge {
      background: rgba(197, 160, 89, 0.1);
      border-color: rgba(197, 160, 89, 0.2);
    }
    .project-icon-large {
      font-size: 4rem;
      color: var(--accent-color);
      margin-bottom: 1.5rem;
    }
    .controls-container {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    .theme-aurora .controls-container {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(197, 160, 89, 0.2);
      box-shadow: 0 8px 32px rgba(197, 160, 89, 0.15);
    }
    .control-btn {
      background: transparent;
      color: var(--text-color);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      font-size: 0.85rem;
      padding: 0;
    }
    .control-btn i {
      font-size: 1.2rem;
      z-index: 2;
      transition: transform 0.3s ease;
    }
    .control-btn span {
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .control-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--accent-color);
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.3s ease;
      border-radius: 50%;
      z-index: 1;
    }
    .control-btn:hover {
      color: white !important;
      transform: translateY(-3px);
    }
    .control-btn:hover i {
      transform: rotate(15deg);
    }
    .control-btn:hover::before {
      opacity: 1;
      transform: scale(1);
    }
    .theme-aurora .control-btn:hover {
      color: #fff !important;
    }

    /* Media Gallery Styles */
    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .media-item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(25, 118, 210, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .theme-aurora .media-item {
      border-color: rgba(197, 160, 89, 0.1);
    }
    .media-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px var(--shadow-color);
      border-color: var(--accent-color);
    }
    .media-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .media-caption {
      padding: 15px;
      font-size: 0.95rem;
      color: var(--text-color);
      font-weight: 500;
      text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .project-header {
        padding: 2rem 0;
        margin-bottom: 2rem;
      }
      .project-icon-large {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .bg-section {
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .controls-container {
        top: 10px;
        right: 10px;
        gap: 5px;
      }
      .control-btn {
        padding: 6px 12px;
        font-size: 0.85rem;
        min-width: 50px;
      }
      .media-gallery {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .skill-badge {
        font-size: 0.75rem;
        padding: 4px 12px;
        margin: 3px;
      }
    }

    @media (max-width: 576px) {
      .project-header {
        padding: 1.5rem 0;
        margin-bottom: 1.5rem;
      }
      .project-icon-large {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      .container {
        padding: 0 10px;
      }
      .bg-section {
        padding: 1rem;
        border-radius: 12px;
      }
      .section-title {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      .controls-container {
        top: 5px;
        right: 5px;
        gap: 3px;
      }
      .control-btn {
        padding: 5px 10px;
        font-size: 0.75rem;
        min-width: 45px;
      }
      .back-btn {
        width: 100%;
        justify-content: center;
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body class="theme-nebula">
  <div class="controls-container">
    <button id="theme-toggle" class="control-btn">Aurore</button>
    <button id="lang-toggle" class="control-btn">EN</button>
  </div>

  <header class="project-header text-center">
    <div class="container">
      <div id="p-icon-container" class="project-icon-large">
        <i class="bi bi-rocket-takeoff"></i>
      </div>
      <h1 id="p-title" class="display-4 fw-bold mb-3">Project Title</h1>
      <div class="mb-4">
        <span id="p-date" class="edu-date-badge">Date</span>
      </div>
      <p id="p-desc" class="lead mx-auto" style="max-width: 800px;">Description</p>
    </div>
  </header>

  <div class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_overview">Project Overview</h2>
          <div id="p-details" class="lh-lg">
            <!-- Content from JSON -->
          </div>
        </section>

        <section class="bg-section" id="media-section" style="display: none;">
          <h2 class="section-title" data-i18n="project_media">Visuals & Diagrams</h2>
          <div id="p-media" class="media-gallery">
            <!-- Media from JSON -->
          </div>
        </section>
      </div>
      <div class="col-lg-4">
        <section class="bg-section">
          <h2 class="section-title" data-i18n="project_tech">Skills</h2>
          <div id="p-skills">
            <!-- Skills from JSON -->
          </div>
        </section>
        
        <div class="text-center mt-4">
          <a href="index.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            <span id="back-btn-text">Back to Projects</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentLang = localStorage.getItem('preferredLang') || 'fr';
        let currentTheme = localStorage.getItem('preferredTheme') || 'nebula';
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let siteData = null;

        const applyTheme = (theme) => {
            document.body.className = `theme-${theme}`;
            if (siteData) {
                const data = siteData[currentLang];
                document.getElementById('theme-toggle').innerHTML = theme === 'nebula' ? 
                    '<i class="bi bi-sun-fill" title="' + data.theme_aurora + '"></i>' : 
                    '<i class="bi bi-moon-stars-fill" title="' + data.theme_nebula + '"></i>';
            }
        };

        const updateUI = (lang) => {
            if (!siteData) return;
            const data = siteData[lang];
            const project = data.projects.find(p => p.id === projectId || p.link.includes(projectId));
            
            if (project) {
                document.getElementById('p-title').textContent = project.title;
                document.getElementById('p-date').textContent = project.date;
                document.getElementById('p-desc').textContent = project.desc;
                document.getElementById('p-details').innerHTML = project.details || project.desc;
                document.title = project.title + " - Thomas Mirbey";
                
                // Update Icon
                const iconContainer = document.getElementById('p-icon-container');
                if (project.icon.startsWith('bi-')) {
                    iconContainer.innerHTML = `<i class="bi ${project.icon}"></i>`;
                } else {
                    iconContainer.innerHTML = `<img src="${project.icon}" style="width:80px; height:80px; object-fit:contain;">`;
                }

                // Update Skills
                const skillsContainer = document.getElementById('p-skills');
                if (project.skills) {
                    skillsContainer.innerHTML = project.skills.map(s => `<span class="skill-badge">${s}</span>`).join('');
                } else {
                    skillsContainer.innerHTML = '';
                }

                // Update Media Gallery
                const mediaSection = document.getElementById('media-section');
                const mediaContainer = document.getElementById('p-media');
                if (project.media && project.media.length > 0) {
                    mediaSection.style.display = 'block';
                    mediaContainer.innerHTML = project.media.map(media => `
                        <div class="media-item">
                            <img src="${media.url}" alt="${media.alt}" />
                            <div class="media-caption">${media.caption || media.alt}</div>
                        </div>
                    `).join('');
                } else {
                    mediaSection.style.display = 'none';
                }
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (data[key]) el.textContent = data[key];
            });
            
            // Fix back button text to avoid double arrows
            const backBtnText = data.back_btn.replace('← ', '').replace('←', '');
            document.getElementById('back-btn-text').textContent = backBtnText;

            document.getElementById('lang-toggle').innerHTML = `<span>${lang === 'fr' ? 'EN' : 'FR'}</span>`;
            applyTheme(currentTheme);
        };

        fetch('data.json')
            .then(r => r.json())
            .then(data => {
                siteData = data;
                updateUI(currentLang);
            });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('preferredLang', currentLang);
            updateUI(currentLang);
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'nebula' ? 'aurora' : 'nebula';
            localStorage.setItem('preferredTheme', currentTheme);
            applyTheme(currentTheme);
        });
        
        applyTheme(currentTheme);
    });
  </script>
</body>
</html>
